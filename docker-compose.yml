version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: land_postgres
    restart: always
    environment:
      POSTGRES_DB: landregistry
      POSTGRES_USER: land_admin
      POSTGRES_PASSWORD: land_secure_password
    command: >
      postgres
      -c max_prepared_transactions=10
      -c log_statement=all
      -c shared_preload_libraries=''
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U land_admin -d landregistry"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7.0
    container_name: land_mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin_secret_pass
      MONGO_INITDB_DATABASE: landregistry
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./scripts/mongo_init.js:/docker-entrypoint-initdb.d/mongo_init.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  mongo_data:
